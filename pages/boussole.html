<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#f7f8fa;
  --panel:#eef1f5;
  --ink:#172033;
  --ink-soft:#5b6472;
  --line:#e5e7eb;
  --blue:#f28c28;
  --blue-soft:#fff1df;
  --amber:#f28c28;
  --amber-soft:#fff4e5;
  --good:#3E6B4A;
  --radius:8px;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Poppins',system-ui,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{ font-family:'Poppins',sans-serif; font-weight:700; margin:0 0 0.4em; letter-spacing:-0.01em; }
p{ margin:0 0 1em; color:var(--ink); }
button{ font-family:inherit; }

/* ---------- Header / footer du site ---------- */
.top-bar{ background-color:#151828; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.08); }
.top-bar-content{ width:95%; max-width:1400px; margin:0 auto; display:flex; justify-content:flex-end; align-items:center; }
.social-links a{ color:#fff; margin-left:15px; font-size:0.9rem; text-decoration:none; }
.social-links a:hover{ color:var(--blue); }
.main-header{ background:#fff; padding:18px 0; box-shadow:0 2px 5px rgba(0,0,0,0.05); }
.header-container{ width:95%; max-width:1400px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
.logo{ text-decoration:none; font-size:1.7rem; font-weight:1000; }
.logo-bold{ color:#ff6b00; }
.logo-orange{ color:#111; }
.main-nav ul{ display:flex; list-style:none; gap:20px; margin:0; padding:0; }
.main-nav a{ text-decoration:none; color:#111; font-size:1rem; }
.main-nav a:hover{ color:var(--blue); border-bottom:2px solid var(--blue); padding-bottom:4px; }
@media (max-width:900px){ .header-container{ flex-direction:column; gap:15px; } .main-nav ul{ flex-wrap:wrap; justify-content:center; gap:12px; } }
.boussole-back{ text-align:center; padding:30px 20px 0; }
.boussole-back a{ color:var(--ink); text-decoration:none; font-weight:600; font-size:14px; }
.boussole-back a:hover{ color:var(--blue); }
.boussole-back i{ margin-right:7px; }
.site-footer{ background:#111827; color:#cbd5e1; text-align:center; padding:25px; font-size:13px; margin-top:40px; }

#shell{
  max-width:760px;
  margin:0 auto;
  padding:56px 24px 96px;
  min-height:100vh;
}

.eyebrow{
  font-size:13px;
  color:var(--blue);
  letter-spacing:0.02em;
  margin-bottom:6px;
  font-weight:500;
}

/* ---------- Intro ---------- */
.intro h1{ font-size:44px; margin-bottom:18px; }
.intro .lede{ font-size:18px; color:var(--ink-soft); max-width:56ch; line-height:1.6; }
.intro-meta{
  display:flex; gap:32px; margin:34px 0 40px;
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  padding:22px 0;
}
.intro-meta div{ display:flex; flex-direction:column; }
.intro-meta strong{ font-family:'Poppins',sans-serif; font-size:30px; color:var(--blue); }
.intro-meta span{ font-size:13px; color:var(--ink-soft); }
.fineprint{ font-size:13px; color:var(--ink-soft); margin-top:16px; }

/* ---------- Buttons ---------- */
.btn{
  border:none; cursor:pointer; border-radius:var(--radius);
  padding:13px 26px; font-size:15px; font-weight:500;
  transition:background .15s ease, color .15s ease, opacity .15s ease;
}
.btn.primary{ background:var(--blue); color:#fff; }
.btn.primary:hover{ background:#25436A; }
.btn.ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
.btn.ghost:hover{ border-color:var(--ink-soft); color:var(--ink); }
.btn:disabled{ opacity:.35; cursor:default; }

/* ---------- Progress ---------- */
.progress-track{ height:3px; background:var(--line); border-radius:2px; margin-bottom:40px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--blue); transition:width .3s ease; }

/* ---------- Step ---------- */
.step-count{ font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
.step h2{ font-size:28px; max-width:32ch; }
.step-intro{ color:var(--ink-soft); max-width:58ch; }
.step-body{ margin:28px 0 36px; }
.nav-row{ display:flex; justify-content:space-between; }

/* Likert */
.likert-row{ padding:18px 0; border-bottom:1px solid var(--line); }
.likert-row:first-child{ border-top:1px solid var(--line); }
.likert-label{ margin:0 0 12px; font-size:15px; max-width:50ch; }
.likert-scale{ display:flex; gap:8px; }
.likert-dot{
  width:40px; height:40px; border-radius:50%;
  border:1px solid var(--line); background:#fff; color:var(--ink-soft);
  cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center;
}
.likert-dot:hover{ border-color:var(--blue); }
.likert-dot.active{ background:var(--blue); border-color:var(--blue); color:#fff; }

/* Multi (pill grid) */
.options-grid{ display:flex; flex-wrap:wrap; gap:10px; }
.opt-pill{
  border:1px solid var(--line); background:#fff; color:var(--ink);
  padding:11px 16px; border-radius:20px; font-size:14.5px; cursor:pointer; text-align:left;
}
.opt-pill:hover{ border-color:var(--blue); }
.opt-pill.active{ background:var(--blue); border-color:var(--blue); color:#fff; }

/* Single (list) */
.options-list{ display:flex; flex-direction:column; gap:10px; }
.opt-line{
  display:flex; align-items:center; gap:12px;
  border:1px solid var(--line); background:#fff; color:var(--ink);
  padding:14px 16px; border-radius:var(--radius); font-size:15px; cursor:pointer; text-align:left;
}
.opt-line:hover{ border-color:var(--blue); }
.opt-line.active{ border-color:var(--blue); background:var(--blue-soft); }
.radio-dot{
  width:16px; height:16px; border-radius:50%; border:1.5px solid var(--ink-soft); flex:none;
  position:relative;
}
.opt-line.active .radio-dot{ border-color:var(--blue); }
.opt-line.active .radio-dot::after{
  content:''; position:absolute; inset:3px; border-radius:50%; background:var(--blue);
}

/* Reality section */
.reality-q{ margin-bottom:30px; }
.reality-title{ font-weight:500; margin-bottom:12px; }

/* ---------- Results ---------- */
.results h2{ font-size:30px; max-width:28ch; }
.domain-filters{ display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 30px; }
.chip{
  border:1px solid var(--line); background:transparent; color:var(--ink-soft);
  padding:7px 13px; border-radius:16px; font-size:13px; cursor:pointer;
}
.chip.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

.results-list{ display:flex; flex-direction:column; }
.result-row{ border-bottom:1px solid var(--line); }
.result-row:first-child{ border-top:1px solid var(--line); }
.result-head{
  width:100%; display:flex; align-items:center; gap:16px;
  background:none; border:none; cursor:pointer; padding:16px 4px; text-align:left;
}
.result-rank{ font-family:'Poppins',sans-serif; font-weight:700; font-size:15px; color:var(--ink-soft); width:20px; flex:none; }
.result-main{ display:flex; flex-direction:column; flex:1; min-width:0; }
.result-name{ font-size:16px; font-weight:500; }
.result-domain{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
.market-badge{
  display:inline-block; font-size:11px; font-weight:500; padding:2px 8px; border-radius:10px;
  margin-left:8px; vertical-align:middle;
}
.market-fort{ background:#E1EAE3; color:var(--good); }
.market-modere{ background:var(--amber-soft); color:var(--amber); }
.market-niche{ background:var(--panel); color:var(--ink-soft); }
.result-market{ font-size:13px; color:var(--ink-soft); margin-top:10px; }
.result-bar-wrap{ width:120px; height:6px; background:var(--panel); border-radius:3px; flex:none; overflow:hidden; }
.result-bar{ display:block; height:100%; background:var(--amber); }
.result-detail{ display:none; padding:0 4px 22px 36px; }
.result-row.open .result-detail{ display:block; }
.result-reasons{ font-size:14px; color:var(--ink-soft); }
.result-empreinte{ font-size:14px; color:var(--ink-soft); background:var(--panel); padding:14px 16px; border-radius:var(--radius); }
.result-flags{ margin-top:10px; }
.flag{ font-size:13px; color:var(--amber); margin:4px 0; }
.flag.gap{ color:var(--blue); }

@media (max-width:600px){
  .intro h1{ font-size:34px; }
  .intro-meta{ gap:20px; flex-wrap:wrap; }
  .likert-dot{ width:34px; height:34px; }
  .result-bar-wrap{ width:60px; }
}

</style>
</head>

// ---------- Scoring ----------

function computeStudentWeights() {
  const w = new Map();
  const add = (tag, amount) => {
    if (!tag) return;
    w.set(tag, (w.get(tag) || 0) + amount);
  };

  SECTIONS.forEach(sec => {
    const ans = state.answers[sec.id] || {};
    if (sec.kind === 'likert') {
      sec.items.forEach((item, i) => {
        const v = ans[i] != null ? ans[i] : 3;
        add(item.tag, v - 3); // -2..+2
      });
    } else if (sec.kind === 'multi') {
      sec.items.forEach((item, i) => {
        if (ans[i]) add(item.tag, 2);
      });
    } else if (sec.kind === 'single') {
      const chosen = ans.choice;
      if (chosen != null) {
        const item = sec.items[chosen];
        if (item) add(item.tag, 2.2);
      }
    }
  });
  // NOTE: SKILLS section is intentionally excluded — it is advisory only and
  // must never influence the interest-based ranking.

  REALITY.items.forEach((q, i) => {
    const oi = state.realityAnswers[i];
    if (oi != null) {
      const opt = q.options[oi];
      opt.tags.forEach(t => add(t, 1.4));
    }
  });

  return w;
}

// self-assessed skill level (1-5) for a given tag, or null if not rated
function skillLevelFor(tag) {
  const ans = state.answers['competences'];
  if (!ans) return null;
  const idx = SKILLS.items.findIndex(it => it.tag === tag);
  if (idx === -1) return null;
  const v = ans[idx];
  return v != null ? v : null;
}

function skillGapFlags(metier, matched) {
  const flags = [];
  const seen = new Set();
  matched.forEach(([tag]) => {
    const lvl = skillLevelFor(tag);
    if (lvl != null && lvl <= 2 && !seen.has(tag)) {
      seen.add(tag);
      const skillItem = SKILLS.items.find(it => it.tag === tag);
      flags.push(`Ce métier valorise « ${skillItem.label.toLowerCase()} » — vous avez indiqué que ce n’est pas encore un point fort. Ce n’est pas rédhibitoire, mais un axe à travailler.`);
    }
  });
  return flags.slice(0, 2);
}

function computeResults() {
  const w = computeStudentWeights();
  const scored = DB.map(m => {
    let raw = 0;
    const matched = [];
    m.flat.forEach(t => {
      const val = w.get(t);
      if (val) {
        raw += val;
        if (val > 0) matched.push([t, val]);
      }
    });
    const norm = raw / Math.sqrt(m.flat.length);
    matched.sort((a, b) => b[1] - a[1]);
    return { metier: m, raw, norm, matched: matched.slice(0, 5) };
  });
  scored.sort((a, b) => b.norm - a.norm);
  const max = scored[0] ? scored[0].norm : 1;
  const min = scored[scored.length - 1] ? scored[scored.length - 1].norm : 0;
  scored.forEach(s => {
    s.pct = max > min ? Math.round(((s.norm - min) / (max - min)) * 100) : 50;
  });
  return scored;
}

  }
  const oi0 = state.realityAnswers[0]; // durée d'études
  if (oi0 === 0) { // veut cycle standard
    const flat = new Set(metier.flat);
    if (flat.has('environnement:RD') && flat.has('mode_type:Recherche_type')) {
      flags.push('Ce métier est souvent plus accessible après un master spécialisé ou une thèse.');
    }
  }
  const oi4 = state.realityAnswers[4]; // débouchés vs passion
  if (oi4 === 0) {
    const flat = new Set(metier.flat);
    if (flat.has('environnement:Laboratoire_e') && flat.has('environnement:RD')) {
      flags.push('Marché plus spécialisé (recherche / R&D) — les postes y sont moins nombreux que dans l’industrie classique.');
    }
  }
  return flags;
}

// ============================================================
// RENDERING
// ============================================================

const app = document.getElementById('app');

function render() {
  if (state.step === -1) return renderIntro();
  if (state.step < ALL_STEPS.length) return renderStep(ALL_STEPS[state.step]);
  return renderResults();
}

function progressPct() {
  return Math.round(((state.step + 1) / (ALL_STEPS.length + 1)) * 100);
}

function renderIntro() {
  app.innerHTML = `
    <div class="intro">
      <p class="eyebrow">Étape C — de l'empreinte au choix</p>
      <h1>La Boussole</h1>
      <p class="lede">Un questionnaire pour confronter vos penchants réels aux empreintes professionnelles
      de 227&nbsp;métiers d'ingénieur, répartis sur 12 domaines — une auto-évaluation de vos compétences actuelles,
      puis une mise à l'épreuve de la réalité du monde professionnel (études, terrain, marché de l'emploi).</p>
      <div class="intro-meta">
        <div><strong>${SECTIONS.length}</strong><span>sections sur vos penchants</span></div>
        <div><strong>1</strong><span>auto-évaluation de compétences</span></div>
        <div><strong>5</strong><span>questions de réalité</span></div>
        <div><strong>227</strong><span>métiers comparés</span></div>
      </div>
      <button class="btn primary" id="start-btn">Commencer</button>
      <p class="fineprint">Compte environ 10 à 15 minutes. Vous pourrez revenir en arrière à tout moment.</p>
    </div>`;
  document.getElementById('start-btn').onclick = () => { state.step = 0; render(); };
}

function renderProgress() {
  return `<div class="progress-track"><div class="progress-fill" style="width:${progressPct()}%"></div></div>`;
}

function renderStep(step) {
  if (step.type === 'section') return renderSection(step.data);
  return renderReality(step.data);
}

function renderSection(sec) {
  const ans = state.answers[sec.id] || (state.answers[sec.id] = {});
  let body = '';

  if (sec.kind === 'likert') {
    const scaleLabels = ['Pas du tout', 'Peu', 'Neutre', 'Beaucoup', 'Énormément'];
    body = sec.items.map((item, i) => {
      const v = ans[i] != null ? ans[i] : 3;
      return `
      <div class="likert-row">
        <p class="likert-label">${item.label}</p>
        <div class="likert-scale" data-idx="${i}">
          ${[1,2,3,4,5].map(n => `<button class="likert-dot ${v===n?'active':''}" data-val="${n}" title="${scaleLabels[n-1]}"><span>${n}</span></button>`).join('')}
        </div>
      </div>`;
    }).join('');
  } else if (sec.kind === 'multi') {
    body = `<div class="options-grid">` + sec.items.map((item, i) => {
      const checked = !!ans[i];
      return `<button class="opt-pill ${checked?'active':''}" data-idx="${i}">${item.label}</button>`;
    }).join('') + `</div>`;
  } else if (sec.kind === 'single') {
    body = `<div class="options-list">` + sec.items.map((item, i) => {
      const checked = ans.choice === i;
      return `<button class="opt-line ${checked?'active':''}" data-idx="${i}"><span class="radio-dot"></span>${item.label}</button>`;
    }).join('') + `</div>`;
  }

  app.innerHTML = `
    ${renderProgress()}
    <div class="step">
      <p class="step-count">Section ${state.step + 1} / ${ALL_STEPS.length}</p>
      <h2>${sec.title}</h2>
      ${sec.intro ? `<p class="step-intro">${sec.intro}</p>` : ''}
      <div class="step-body">${body}</div>
      <div class="nav-row">
        <button class="btn ghost" id="prev-btn" ${state.step===0?'disabled':''}>Précédent</button>
        <button class="btn primary" id="next-btn">Suivant</button>
      </div>
    </div>`;

  if (sec.kind === 'likert') {
    app.querySelectorAll('.likert-scale').forEach(scale => {
      scale.querySelectorAll('.likert-dot').forEach(dot => {
        dot.onclick = () => {
          const idx = +scale.dataset.idx;
          ans[idx] = +dot.dataset.val;
          renderStep({ type: 'section', data: sec });
        };
      });
    });
  } else if (sec.kind === 'multi') {
    app.querySelectorAll('.opt-pill').forEach(btn => {
      btn.onclick = () => {
        const idx = +btn.dataset.idx;
        const activeCount = Object.values(ans).filter(Boolean).length;
        if (!ans[idx] && activeCount >= sec.max) return; // limit reached
        ans[idx] = !ans[idx];
        renderStep({ type: 'section', data: sec });
      };
    });
  } else if (sec.kind === 'single') {
    app.querySelectorAll('.opt-line').forEach(btn => {
      btn.onclick = () => {
        ans.choice = +btn.dataset.idx;
        renderStep({ type: 'section', data: sec });
      };
    });
  }

  document.getElementById('prev-btn').onclick = () => { if (state.step>0){ state.step--; render(); } };
  document.getElementById('next-btn').onclick = () => { state.step++; render(); };
}

function renderReality(rq) {
  const body = rq.items.map((q, qi) => {
    const chosen = state.realityAnswers[qi];
    return `
    <div class="reality-q">
      <p class="reality-title">${q.title}</p>
      <div class="options-list">
        ${q.options.map((opt, oi) => `<button class="opt-line ${chosen===oi?'active':''}" data-qi="${qi}" data-oi="${oi}"><span class="radio-dot"></span>${opt.label}</button>`).join('')}
      </div>
    </div>`;
  }).join('');

  app.innerHTML = `
    ${renderProgress()}
    <div class="step">
      <p class="step-count">Dernière étape</p>
      <h2>${rq.title}</h2>
      <p class="step-intro">${rq.intro}</p>
      <div class="step-body">${body}</div>
      <div class="nav-row">
        <button class="btn ghost" id="prev-btn">Précédent</button>
        <button class="btn primary" id="next-btn">Voir mes résultats</button>
      </div>
    </div>`;

  app.querySelectorAll('.opt-line').forEach(btn => {
    btn.onclick = () => {
      state.realityAnswers[+btn.dataset.qi] = +btn.dataset.oi;
      renderReality(rq);
    };
  });
  document.getElementById('prev-btn').onclick = () => { state.step--; render(); };
  document.getElementById('next-btn').onclick = () => {
    state.results = computeResults();
    state.step++;
    render();
  };
}

function renderResults() {
  if (!state.results) state.results = computeResults();
  const domains = [...new Set(DB.map(m => m.domain))];
  const filtered = state.domainFilter
    ? state.results.filter(r => r.metier.domain === state.domainFilter)
    : state.results;
  const top = filtered.slice(0, 15);

  app.innerHTML = `
    <div class="results">
      <p class="eyebrow">Vos résultats</p>
      <h2>Les métiers les plus proches de votre profil</h2>
      <p class="step-intro">Ce classement combine vos penchants (sections 1 à 11) et vos réponses de réalité
      professionnelle. Chaque métier affiche aussi une estimation de la <strong>tension du marché</strong> (Fort /
      Modéré / Niche) et, si un métier s'appuie sur une compétence que vous avez notée comme un point faible,
      un repère 🎯 « axe à travailler ». Ces deux ajouts sont indicatifs, construits à partir de la structure du
      métier — pas une donnée d'emploi en temps réel : vérifiez toujours les offres réelles (ANAPEC, emploi.ma,
      LinkedIn) avant de trancher. Un score élevé signifie une forte correspondance d'empreinte — pas une garantie
      de réussite ou de plaisir : c'est un point de départ pour approfondir, pas une conclusion.</p>

      <div class="domain-filters">
        <button class="chip ${!state.domainFilter?'active':''}" data-domain="">Tous les domaines</button>
        ${domains.map(d => `<button class="chip ${state.domainFilter===d?'active':''}" data-domain="${d}">${d.replace(/^DOMAINE\s*\d+\s*—\s*/i,'').replace(/^Domaine\s*\d+\s*—\s*/,'')}</button>`).join('')}
      </div>

      <div class="results-list">
        ${top.map((r, i) => renderResultRow(r, i)).join('')}
      </div>

      <button class="btn ghost" id="restart-btn">Recommencer le questionnaire</button>
    </div>`;

  app.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => {
      state.domainFilter = chip.dataset.domain || null;
      renderResults();
    };
  });
  app.querySelectorAll('.result-row').forEach(row => {
    row.querySelector('.result-head').onclick = () => {
      row.classList.toggle('open');
    };
  });
  document.getElementById('restart-btn').onclick = () => {
    if (confirm('Recommencer effacera vos réponses actuelles. Continuer ?')) {
      state.step = -1; state.answers = {}; state.realityAnswers = {}; state.results = null; state.domainFilter = null;
      render();
    }
  };
}

function renderResultRow(r, i) {
  const m = r.metier;
  const domainShort = m.domain.replace(/^DOMAINE\s*\d+\s*—\s*/i,'').replace(/^Domaine\s*\d+\s*—\s*/,'');
  const reasons = r.matched.map(([t]) => tagLabel(t));
  const flags = realityFlags(m);
  const gapFlags = skillGapFlags(m, r.matched);
  const mkt = MARKET_INFO[m.marche] || MARKET_INFO.modere;
  return `
  <div class="result-row">
    <button class="result-head">
      <span class="result-rank">${i+1}</span>
      <span class="result-main">
        <span class="result-name">${m.name}</span>
        <span class="result-domain">${domainShort} <span class="market-badge market-${m.marche}" title="${mkt.hint}">${mkt.label}</span></span>
      </span>
      <span class="result-bar-wrap"><span class="result-bar" style="width:${Math.max(r.pct,6)}%"></span></span>
    </button>
    <div class="result-detail">
      ${reasons.length ? `<p class="result-reasons"><strong>Pourquoi ce métier ressort :</strong> ${reasons.join(' · ')}.</p>` : ''}
      <p class="result-empreinte">${m.empreinte.replace(/\n/g, '<br>')}</p>
      <p class="result-market"><strong>${mkt.label} :</strong> ${mkt.hint}</p>
      ${flags.length ? `<div class="result-flags">${flags.map(f=>`<p class="flag">⚠ ${f}</p>`).join('')}</div>` : ''}
      ${gapFlags.length ? `<div class="result-flags">${gapFlags.map(f=>`<p class="flag gap">🎯 ${f}</p>`).join('')}</div>` : ''}
    </div>
  </div>`;
}

render();

</script>
</body>
</html>
